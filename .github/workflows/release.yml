# Release workflow from gootecks/hooks-lint-format/github, adapted: macOS runner, hand-written CHANGELOG.md,
# Developer ID signing and notarization, and a zipped app attached to the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install commitizen
        run: pipx install commitizen==4.19.3

      - name: Find the next version
        id: next
        run: |
          code=0
          version=$(cz bump --get-next) || code=$?
          if [ "$code" -eq 21 ]; then
            echo "No feat, fix or breaking commit since the last tag; nothing to release."
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import the Developer ID certificate
        if: steps.next.outputs.version != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$CERT_P12" ] && [ -n "$API_KEY_P8" ] || { echo "Signing secrets are missing; see docs/releasing.md." >&2; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "The certificate is not a Developer ID Application certificate." >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_ENV"

      - name: Bump version and changelog
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release-notes.sh "$VERSION" "$RUNNER_TEMP/notes.md"
          git add CHANGELOG.md
          cz bump --yes

      - name: Build, sign and notarize
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          sh scripts/build.sh
          scripts/notarize.sh build/TSQuickLook.app
          ditto -c -k --keepParent build/TSQuickLook.app "build/TSQuickLook-$VERSION.zip"

      - name: Push the bump commit and tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: git push --atomic "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:main "v$VERSION"

      - name: Create the GitHub Release
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/TSQuickLook-$VERSION.zip" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
