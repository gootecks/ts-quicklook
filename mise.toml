[tools]
hk = "2.12.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
rumdl = "0.3.2"
"npm:oxfmt" = "0.77.0"
swiftformat = "0.64.4"
swiftlint = "0.65.1"

[tasks.build]
description = "Build build/TSQuickLook.app"
run = "sh scripts/build.sh"

[tasks.install]
description = "Build, copy to ~/Applications and register the Quick Look extension"
run = "sh scripts/install.sh"

[tasks.uninstall]
description = "Unregister the extension and remove ~/Applications/TSQuickLook.app"
run = "sh scripts/uninstall.sh"
